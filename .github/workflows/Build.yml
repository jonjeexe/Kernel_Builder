name: Kernel Builder

on:
  push:
    branches:
      - manything
  workflow_dispatch:

env:
  ARCH: arm64
  CC: clang
  CLANG_TRIPLE: aarch64-linux-gnu-
  CCACHE_DIR: /tmp/ccache


jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone kernel source
        run: |
          git clone --depth=1 -b yoka https://github.com/jonjeexe/niigo_kernel_xiaomi_blossom.git .

      - name: Clone AnyKernel3 for Blossom 
        run: |
          git clone --depth=1 https://github.com/jonjeexe/Kernel_builder.git Kernel_builder

      - name: Setup ccache
        uses: actions/cache@v3
        with:
          path: /tmp/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential bc bison flex \
            libssl-dev libelf-dev zlib1g-dev \
            clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 python3-pip ninja-build zip ccache
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld || true
          echo "VERSION=$(grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL' Makefile | awk '{print $3}' | paste -sd. - | sed 's/\.\(-.*\)/\1/')" >> $GITHUB_ENV

      - name: Set Kbuild prop
        run: |
          echo "KBUILD_BUILD_HOST=Ubuntu" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=Jonjeexe" >> $GITHUB_ENV

      - name: Notify start on Telegram
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            --data-urlencode "text= *Kernel Build Started!*
            *Device:* blossom
            *Arch:* arm64
            *Kernel Version* $VERSION
            *Commit:* [${GITHUB_SHA::7}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})" \
            -d parse_mode=Markdown

      - name: Build the kernel and log output
        run: |
          mkdir -p out
          START=$(date +%s)

          {
            echo "### Kernel Build Started: $(date)"
            make O=out ARCH=$ARCH CC="ccache clang" blossom_defconfig
            make -j$(nproc) O=out ARCH=$ARCH CC="ccache clang" \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump STRIP=llvm-strip \
              LD=ld.lld LLVM_IAS=1
          } 2>&1 | tee build.log

          END=$(date +%s)
          echo "BUILD_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "BUILD_TIME=$((END - START))" >> $GITHUB_ENV
          ls -l out/arch/arm64/boot/Image.gz-dtb
          echo "MD5_CHECKSUM=$(md5sum out/arch/arm64/boot/Image.gz-dtb | cut -d ' ' -f1)" >> $GITHUB_ENV

      - name: Set build info (time, md5)
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            MD5=$(md5sum out/arch/arm64/boot/Image.gz-dtb | cut -d ' ' -f1)
            echo "MD5_CHECKSUM=$MD5" >> $GITHUB_ENV
            echo "ZIP_NAME=Image.gz-dtb" >> $GITHUB_ENV
          else
            echo "MD5_CHECKSUM=not_found" >> $GITHUB_ENV
          fi

      - name: Package kernel into Kernel_builder zip
        if: success()
        run: |
          DATE=$(date +'%Y-%m-%d')
          echo "PACKAGE_DATE=$DATE" >> $GITHUB_ENV
          ZIP_FILENAME="niigo_blossom-kernel-${DATE}.zip"
          echo "FINAL_ZIP=$ZIP_FILENAME" >> $GITHUB_ENV

          # Copy kernel image into Kernel_builder folder
          cp out/arch/arm64/boot/Image.gz-dtb Kernel_builder/

          # Zip the Kernel_builder folder contents
          cd Kernel_builder
          zip -r9 ../${ZIP_FILENAME} *
          cd ..

          echo "Packaged zip: $ZIP_FILENAME"
          ls -lh ${ZIP_FILENAME}

      - name: Append build log with summary
        if: always()
        run: |
          echo -e "\n\n### 🧵 Last 50 lines:\n" >> build.log
          tail -n 50 build.log >> build.log
          echo -e "\n### 🧠 CCACHE Stats:\n" >> build.log
          ccache --show-stats >> build.log

      - name: Upload kernel zip as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: niigo_blossom-kernel-${{ env.PACKAGE_DATE }}
          path: ${{ env.FINAL_ZIP }}
          retention-days: 14

      - name: Upload build log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 14

      - name: Notify success and send zip to Telegram
        if: success()
        run: |
          CAPTION="✅ Build Successful!
          Date    : ${BUILD_DATE}
          Time    : ${BUILD_TIME}s
          MD5     : ${MD5_CHECKSUM}
          Package : ${FINAL_ZIP}"
          curl -s \
            -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F document=@${FINAL_ZIP} \
            -F caption="$CAPTION" \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument

      - name: Notify failure on Telegram
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            --data-urlencode "text=❌ *Kernel build failed!*
            *Commit:* [${GITHUB_SHA::7}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})" \
            -d parse_mode=Markdown

      - name: Send build log to Telegram
        if: always()
        run: |
          curl -s -F document=@build.log \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F caption="📄 Kernel build log"
            
